title: "[質問] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |-
        firefox-icon-fencesに関する内容を、目的と確認できた事実に分けて記載してください。
        Cookie、認証トークン、パスワード、個人情報を本文や添付に含めないでください。
  - type: textarea
    id: question
    attributes:
      label: 質問
      description: 試したことと、どこで困っているかを記載してください。
    validations:
      required: true
  - type: textarea
    id: environment-common
    attributes:
      label: 対象と環境
      description: 使用中の版、OS、関連ツール、機器や接続方法を秘密情報を除いて記載してください。
    validations:
      required: false
  - type: textarea
    id: attempted-common
    attributes:
      label: 試したことと結果
      description: 試した手順、期待した結果、実際の結果を記載してください。
    validations:
      required: false
  - type: textarea
    id: additional-common
    attributes:
      label: 補足
      description: 関連資料と、確認できなかった条件を記載してください。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文と添付に秘密情報や個人情報が含まれていないことを確認しました。
          required: true
