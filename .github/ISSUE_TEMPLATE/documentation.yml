name: ドキュメント改善
description: 説明不足、誤記、分かりにくい手順を報告します
title: "[Docs] "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |-
        firefox-icon-fencesに関する内容を、目的と確認できた事実に分けて記載してください。
        Cookie、認証トークン、パスワード、個人情報を本文や添付に含めないでください。
        投稿前に[README](https://github.com/roflsunriz/firefox-icon-fences/blob/main/README.md)と[既存Issue](https://github.com/roflsunriz/firefox-icon-fences/issues)を確認してください。
        脆弱性の報告は[SECURITY.md](https://github.com/roflsunriz/firefox-icon-fences/blob/main/SECURITY.md)の案内に従ってください。
  - type: input
    id: location
    attributes:
      label: 対象文書・箇所
      placeholder: README.md のインストール手順
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 現在の記載と問題
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 期待する記載
  - type: textarea
    id: additional-common
    attributes:
      label: 補足
      description: 根拠となる資料や、試した環境と結果を記載してください。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文と添付に秘密情報や個人情報が含まれていないことを確認しました。
          required: true
