name: 不具合報告
description: フェンスの表示、配置、インストールに関する不具合を報告します
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |-
        firefox-icon-fencesに関する内容を、目的と確認できた事実に分けて記載してください。
        Cookie、認証トークン、パスワード、個人情報を本文や添付に含めないでください。
        投稿前に[README](https://github.com/roflsunriz/firefox-icon-fences/blob/main/README.md)と[既存Issue](https://github.com/roflsunriz/firefox-icon-fences/issues)を確認してください。
        脆弱性の報告は[SECURITY.md](https://github.com/roflsunriz/firefox-icon-fences/blob/main/SECURITY.md)の案内に従ってください。
  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認
      options:
        - label: 既存Issueを検索しました。
          required: false
        - label: 可能な範囲で最新の公開版でも確認しました。
          required: false
  - type: input
    id: firefox-version
    attributes:
      label: Firefoxのバージョン
      placeholder: "155.0"
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: OS
      placeholder: Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Firefoxテーマ
      options:
        - ライト
        - ダーク
        - システム
        - その他
    validations:
      required: true
  - type: textarea
    id: environment-common
    attributes:
      label: 対象と環境
      description: 対象機能、使用中の版またはコミット、OSと実行環境を記載してください。
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: どの番号のフェンスで起きるかも記載してください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
    validations:
      required: true
  - type: textarea
    id: diagnostics-common
    attributes:
      label: 診断情報
      description: 秘密情報を除いたログや画面を添付してください。
    validations:
      required: false
  - type: textarea
    id: additional-common
    attributes:
      label: 補足
      description: 発生頻度、直前の変更、回避策、確認できない条件を記載してください。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文と添付に秘密情報や個人情報が含まれていないことを確認しました。
          required: true
